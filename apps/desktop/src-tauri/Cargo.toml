[package]
name = "switcher-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
switcher-domain.workspace = true
switcher-core.workspace = true
tauri.workspace = true
serde_json.workspace = true
tokio.workspace = true
libc.workspace = true
serde.workspace = true
tauri-plugin-updater.workspace = true
ed25519-dalek = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
security-framework = { workspace = true, optional = true }
base64.workspace = true

[features]
default = ["personal"]
personal = ["dep:ed25519-dalek", "dep:chacha20poly1305", "dep:argon2", "dep:zeroize", "dep:security-framework"]
public = []
ipc-smoke = []
ipc-limits = []
ipc-business = []
custom-protocol = ["tauri/custom-protocol"]
